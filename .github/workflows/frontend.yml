name: Frontend Build Check

on:
  push:
    paths:
      - "bookkeeping-app/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "bookkeeping-app/**"

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: bookkeeping-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build
