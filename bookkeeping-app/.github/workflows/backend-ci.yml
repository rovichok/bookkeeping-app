name: Backend CI

on:
  pull_request:
    branches:
      - develop
      - main

  push:
    branches:
      - develop
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore Lentis.Api/Lentis.Api.csproj

      - name: Build backend
        run: dotnet build Lentis.Api/Lentis.Api.csproj --configuration Release --no-restore
